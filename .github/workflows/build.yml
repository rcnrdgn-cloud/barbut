      - name: Atış hareketleri ve ayarlar (sürüm 22)
        working-directory: barbut_app
        run: |
          python3 - <<'PATCH_EOF'
          import sys

          def edit(path, pairs):
              s = open(path, encoding='utf-8').read()
              for old, new in pairs:
                  if s.count(old) != 1:
                      sys.exit(f'YAMA BULUNAMADI: {path}: {old[:70]!r}')
                  s = s.replace(old, new)
              open(path, 'w', encoding='utf-8').write(s)

          edit('lib/hand_screen.dart', [
              # masadan düşme: her 10 atıştan biri yerine yaklaşık her 33 atıştan biri
              ("static const dropChance = 0.10;", "static const dropChance = 0.03;"),
              ("static const bothShare = 0.3;", "static const bothShare = 0.2;"),
              # eğerek dökme daha çabuk: sallama sonrası bekleme kısaldı, hızlı devirmede hiç beklenmez
              ("static const shakeQuietMs = 120;", "static const shakeQuietMs = 70;"),
              ("if (_armed && tilt > pourAngle && !shaking &&",
               "if (_armed && tilt > pourAngle && (!shaking || _tiltRate.abs() > 2.5) &&"),
              ("DateTime.now().difference(_releasedAt).inMilliseconds > 1000",
               "DateTime.now().difference(_releasedAt).inMilliseconds > 500"),
              # sonuç yazısının altındaki açıklama yalnızca zar düştüğünde kalsın
              ("Text(sub,", "if (fell > 0) Text(sub,"),
              # ileri savurma
              ("double _tiltRate = 0; // ucun aşağı devrilme hızı (rad/s)",
               r'''double _tiltRate = 0; // ucun aşağı devrilme hızı (rad/s)

            /// İleri savurma eşikleri (m/s²): itiş, duruş, sakinlik.
            static const tossPush = 5.0, tossStop = 7.0, tossCalm = 5.0;
            DateTime _tossPushAt = DateTime(0), _tossBackAt = DateTime(0);
            DateTime? _tossStopAt, _tossCalmFrom;
            bool _tossUp = false, _tossBlocked = false;
            double _tossPeak = 0;'''),
              ("if (!sensorsOk && mounted) setState(() => sensorsOk = true);",
               "if (!sensorsOk && mounted) setState(() => sensorsOk = true);\n"
               "                    _checkToss(e.x, e.y, e.z);"),
              ("/* ---------------- elde ---------------- */",
               r'''/// Fincanı ileri savurma. "İleri", telefon hangi açıda tutulursa tutulsun telefonun
            /// ucunun yere paralel baktığı yöndür. Önce o yöne bir itiş, hemen ardından sert bir
            /// duruş ve 60 ms sakinlik: zarlar fincan durunca ileri fırlar. Sallamada her itişten
            /// hemen önce bir geri hamle olur ve ardından sakinlik gelmez; bu yüzden sayılmaz.
            void _checkToss(double ex, double ey, double ez) {
              if (phase != Phase.holding || game.over) {
                _tossStopAt = null;
                return;
              }
              final now = DateTime.now();
              if (now.difference(_phaseStart).inMilliseconds < 300) return;
              final gn = sqrt(_gx * _gx + _gy * _gy + _gz * _gz);
              if (gn < 1) return;
              final ux = _gx / gn, uy = _gy / gn, uz = _gz / gn; // telefona göre yukarı
              var fx = -uy * ux, fy = 1 - uy * uy, fz = -uy * uz; // telefonun ucunun yataydaki yönü
              final fn = sqrt(fx * fx + fy * fy + fz * fz);
              final level = uz > 0.2 && fn > 0.55; // ekran yukarı bakıyor, telefon dik değil
              if (fn < 0.01) return;
              fx /= fn;
              fy /= fn;
              fz /= fn;
              final lx = ex - _gx, ly = ey - _gy, lz = ez - _gz; // yerçekimi çıkarılmış ivme
              final lf = lx * fx + ly * fy + lz * fz; // ileri bileşen
              final lu = lx * ux + ly * uy + lz * uz;
              final sx = lx - lf * fx - lu * ux, sy = ly - lf * fy - lu * uy, sz = lz - lf * fz - lu * uz;
              final lat = sqrt(sx * sx + sy * sy + sz * sz); // yana bileşen

              final up = level && lf > tossPush && lf > 1.2 * lat;
              if (up && !_tossUp) {
                // yeni bir itiş başlıyor: hemen öncesinde geri hamle varsa bu bir sallamadır
                _tossBlocked = now.difference(_tossBackAt).inMilliseconds < 120;
                if (_tossBlocked) _tossStopAt = null;
                _tossPeak = 0;
              }
              _tossUp = up;
              if (up) {
                _tossPushAt = now;
                _tossPeak = max(_tossPeak, lf);
              }
              if (lf < -tossPush) _tossBackAt = now;
              final pushed = now.difference(_tossPushAt).inMilliseconds < 400;
              if (level && pushed && !_tossBlocked && lf < -tossStop) {
                _tossStopAt = now;
                _tossCalmFrom = null;
              }
              final stop = _tossStopAt;
              if (stop == null) return;
              final calm = sqrt(lx * lx + ly * ly + lz * lz) < tossCalm;
              _tossCalmFrom = calm ? (_tossCalmFrom ?? now) : null;
              final calmFrom = _tossCalmFrom;
              if (now.difference(stop).inMilliseconds > 450) {
                _tossStopAt = null;
              } else if (calmFrom != null && now.difference(calmFrom).inMilliseconds >= 60) {
                _tossStopAt = null;
                _toss(_tossPeak);
              }
            }

            void _toss(double peak) {
              if (phase != Phase.holding || game.over || table == null) return;
              // savurma ne kadar sertse, sallama ne kadar çoksa zarlar o kadar güçlü gider
              _releaseStrength = max(_shakeStrength, (0.6 + peak / 20).clamp(0.6, 1.4));
              _shakeEnergy = 0;
              _releasedAt = DateTime.now();
              ImpactFeel.I.release(_releaseStrength);
              setState(() {
                phase = Phase.released;
                diceOnTable = false;
                verdictOn = false;
              });
              _launchPoured();
            }

            /* ---------------- elde ---------------- */'''),
              ("'ucu yatayı aşağı doğru geçtiği an zarlar dökülür.';",
               "'ucunu yatayın altına indir ya da fincanı ileri savurur gibi telefonu ileri itip durdur: zarlar dökülür.';"),
          ])
          print('Atış hareketleri ve ayarlar uygulandı')
          PATCH_EOF

