          /// Masadaki zarlar: yukarıdan bakış, yuvarlanırken iki yüz görünür.
          class DicePainter extends CustomPainter {
            DicePainter(this.sim, Listenable repaint, {required this.opacity}) : super(repaint: repaint);

            final TableSim sim;
            final double opacity;

            @override
            void paint(Canvas canvas, Size size) {
              if (opacity <= 0) return;
              final list = [...sim.dice]..sort((a, b) => a.z.compareTo(b.z));
              if (opacity < 1) {
                canvas.saveLayer(Offset.zero & size, Paint()..color = Color.fromRGBO(0, 0, 0, opacity));
              }
              for (final d in list) {
                _drawDie(canvas, d, sim.s);
              }
              if (opacity < 1) canvas.restore();
            }

            void _drawDie(Canvas canvas, TableDie d, double s) {
              final lift = d.z;
              final scale = 1 + lift / (s * 5);

              // gölge: zar yükseldikçe uzaklaşır ve yumuşar
              final shadowCenter = Offset(d.x + lift * 0.35 + s * 0.06, d.y + lift * 0.5 + s * 0.08);
              canvas.drawRRect(
                RRect.fromRectAndRadius(
                  Rect.fromCenter(center: shadowCenter, width: s * (1 + lift / (s * 8)), height: s * (1 + lift / (s * 8))),
                  Radius.circular(s * 0.2),
                ),
                Paint()
                  ..color = Color.fromRGBO(0, 0, 0, (0.55 - lift / (s * 12)).clamp(0.15, 0.55))
                  ..maskFilter = MaskFilter.blur(BlurStyle.normal, s * 0.06 + lift * 0.06),
              );

              canvas.save();
              canvas.translate(d.x, d.y - lift * 0.15);
              canvas.rotate(d.visHeading);
              canvas.scale(scale);

              final phi = d.phi.clamp(0.0, pi / 2);
              final c = cos(phi), sn = sin(phi);
              final wTop = s * c, wBack = s * sn;
              final left = -(wTop + wBack) / 2;
              if (wBack > 0.5) _face(canvas, d.next, left, wBack, s, 0.62 + 0.33 * sn);
              if (wTop > 0.5) _face(canvas, d.top, left + wBack, wTop, s, 1 - 0.25 * sn);
              canvas.restore();
            }

            void _face(Canvas canvas, int value, double left, double width, double s, double shade) {
              canvas.save();
              canvas.translate(left, -s / 2);
              canvas.scale(width / s, 1);
              paintDieFace(canvas, s, value);
              if (shade < 1) {
                canvas.drawRRect(
                  RRect.fromRectAndRadius(Rect.fromLTWH(0, 0, s, s), Radius.circular(s * 0.16)),
                  Paint()..color = Color.fromRGBO(20, 12, 4, (1 - shade).clamp(0.0, 0.6)),
                );
              }
              canvas.restore();
            }

            @override
            bool shouldRepaint(covariant DicePainter old) => true;
          }

          /// Kahvehane masası: koyu ceviz, damarlar, kenar pervazı.
          class WoodTablePainter extends CustomPainter {
            const WoodTablePainter();

            @override
            void paint(Canvas canvas, Size size) {
              final rect = Offset.zero & size;
              canvas.drawRect(
                rect,
                Paint()
                  ..shader = const LinearGradient(
                    begin: Alignment.topCenter,
                    end: Alignment.bottomCenter,
                    colors: [Color(0xFF2B180D), Color(0xFF4A2C17), Color(0xFF3A2212), Color(0xFF2A170C)],
                    stops: [0, 0.4, 0.75, 1],
                  ).createShader(rect),
              );

              // ahşap damarları (sabit tohum: her açılışta aynı masa)
              final rng = Random(1923);
              final dark = Paint()
                ..style = PaintingStyle.stroke
                ..color = const Color(0x22000000);
              final light = Paint()
                ..style = PaintingStyle.stroke
                ..color = const Color(0x12FFD9A8);
              for (var i = 0; i < 150; i++) {
                final y0 = rng.nextDouble() * size.height;
                final amp = 2 + rng.nextDouble() * 9;
                final freq = 0.004 + rng.nextDouble() * 0.01;
                final phase = rng.nextDouble() * pi * 2;
                final path = Path()..moveTo(0, y0);
                for (double x = 0; x <= size.width; x += 8) {
                  path.lineTo(x, y0 + sin(x * freq + phase) * amp + sin(x * freq * 3.1 + phase) * amp * 0.25);
                }
                final p = rng.nextBool() ? dark : light;
                p.strokeWidth = 0.6 + rng.nextDouble() * 2.2;
                canvas.drawPath(path, p);
              }
              // budak
              for (var k = 0; k < 2; k++) {
                final c = Offset(rng.nextDouble() * size.width, rng.nextDouble() * size.height);
                for (var r = 4.0; r < 40; r += 4) {
                  canvas.drawOval(Rect.fromCenter(center: c, width: r * 3.2, height: r), dark..strokeWidth = 1);
                }
              }
              // kenarlara doğru kararma
              canvas.drawRect(
                rect,
                Paint()
                  ..shader = const RadialGradient(
                    radius: 0.95,
                    colors: [Color(0x00000000), Color(0x8C000000)],
                    stops: [0.55, 1],
                  ).createShader(rect),
              );
              // pervaz
              const rail = TableSim.rail;
              final outer = RRect.fromRectAndRadius(rect, Radius.zero);
              final inner = RRect.fromRectAndRadius(rect.deflate(rail), const Radius.circular(6));
              canvas.drawDRRect(outer, inner, Paint()..color = const Color(0xFF1A0E07));
              canvas.drawRRect(
                inner,
                Paint()
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 1.5
                  ..color = const Color(0x40FFD9A0),
              );
              canvas.drawRRect(
                inner.deflate(2),
                Paint()
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 4
                  ..color = const Color(0x33000000)
                  ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 3),
              );
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => false;
          }
