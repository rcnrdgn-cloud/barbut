          class _TableScreenState extends State<TableScreen> {
            final game = Game();
            List<int> dice = [6, 5];
            int rollId = 0;
            bool withCup = true;
            bool busy = false;
            bool shakeOn = false;
            bool verdictOn = false;
            Roll? shown;
