name: Uygulamayı derle

# Tek dosyalık kurulum (sürüm 6: tavla adları, zarlar ortada): tüm Barbut kodu ve sesleri bu dosyanın içinden üretilir.
# Depoda başka hiçbir dosyaya gerek yoktur.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Boş Flutter projesi oluştur
        run: flutter create --org com.ercan --project-name barbut --platforms=android,ios barbut_app

      - name: Barbut kodunu yaz
        working-directory: barbut_app
        run: |
          set -e
          rm -rf lib test tool
          mkdir -p lib test tool assets/sounds
          cat > pubspec.yaml <<'BARBUT_EOF'
          name: barbut
          description: İki kişilik barbut zar oyunu — gerçek zar hissi, ses ve titreşimle.
          publish_to: 'none'
          version: 0.1.0+1

          environment:
            sdk: ">=3.3.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            flutter_soloud: ">=2.1.0 <4.0.0"
            sensors_plus: ^6.1.0
            vibration: ">=2.0.0 <4.0.0"

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0

          flutter:
            uses-material-design: true
            assets:
              - assets/sounds/
          BARBUT_EOF
          cat > lib/main.dart <<'BARBUT_EOF'
          import 'dart:async';

          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          import 'errors.dart';
          import 'feel.dart';
          import 'hand_feel.dart';
          import 'hand_screen.dart';
          import 'palette.dart';
          import 'sound.dart';

          void main() {
            runZonedGuarded(() async {
              WidgetsFlutterBinding.ensureInitialized();
              FlutterError.onError = (details) {
                FlutterError.presentError(details);
                ErrorLog.add(details.exception, details.stack);
              };
              try {
                await SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp]);
              } catch (e, s) {
                ErrorLog.add(e, s);
              }
              try {
                await SoundEngine.I.init().timeout(const Duration(seconds: 8));
              } catch (e, s) {
                ErrorLog.add(e, s);
              }
              try {
                await Feel.I.init().timeout(const Duration(seconds: 3));
              } catch (e, s) {
                ErrorLog.add(e, s);
              }
              try {
                await ImpactFeel.I.init().timeout(const Duration(seconds: 3));
              } catch (e, s) {
                ErrorLog.add(e, s);
              }
              runApp(const BarbutApp());
            }, (e, s) => ErrorLog.add(e, s));
          }

          class BarbutApp extends StatelessWidget {
            const BarbutApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Barbut',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: Palette.bg,
                  colorScheme: const ColorScheme.dark(
                    primary: Palette.gold,
                    surface: Palette.surface,
                    onSurface: Palette.ink,
                  ),
                ),
                home: const HandScreen(),
              );
            }
          }
          BARBUT_EOF
          cat > lib/errors.dart <<'BARBUT_EOF'
          import 'package:flutter/foundation.dart';

          /// Uygulama içindeki hataları ekranda göstermek için toplar.
          class ErrorLog {
            static final ValueNotifier<List<String>> items = ValueNotifier<List<String>>(const []);

            static void add(Object error, [StackTrace? stack]) {
              final first = error.toString().split('\n').first;
              final where = (stack?.toString() ?? '').split('\n').where((l) => l.trim().isNotEmpty).take(3).join('\n');
              if (items.value.any((x) => x.startsWith(first))) return; // aynı hatayı tekrar yazma
              final list = [...items.value, where.isEmpty ? first : '$first\n$where'];
              items.value = list.length > 5 ? list.sublist(list.length - 5) : list;
              debugPrint('BARBUT HATA: $error\n$stack');
            }

            static void clear() => items.value = const [];
          }
          BARBUT_EOF
          cat > lib/palette.dart <<'BARBUT_EOF'
          import 'package:flutter/material.dart';

          /// Lacivert tepsi, kemik zar, eski altın.
          class Palette {
            static const bg = Color(0xFF0E1222);
            static const surface = Color(0xFF151B30);
            static const ink = Color(0xFFE9E1CE);
            static const muted = Color(0xFF9EA2B5);
            static const line = Color(0x24E9E1CE);
            static const gold = Color(0xFFD4B158);
            static const win = Color(0xFF6CC79B);
            static const lose = Color(0xFFEE7B8C);
            static const tray = Color(0xFF121A36);
            static const trayEdge = Color(0xFFB8933A);
            static const bone = Color(0xFFEFE6D2);
            static const boneLight = Color(0xFFFBF6EA);
            static const boneShade = Color(0xFFCDBF9F);
            static const pip = Color(0xFF1B1712);
            static const pipRed = Color(0xFFA3192E);

            static const display = 'serif';
          }
          BARBUT_EOF
          cat > lib/game.dart <<'BARBUT_EOF'
          import 'dart:math';

          enum Outcome { win, lose, pass }

          /// Tavlada kullanılan Farsça sayı adları.
          const _fa = {1: 'yek', 2: 'dü', 3: 'se', 4: 'cihar', 5: 'penç', 6: 'şeş'};

          /// Çiftlerin geleneksel adları.
          const _doubles = {1: 'Hep yek', 2: 'Dubara', 3: 'Dü se', 4: 'Dört cihar', 5: 'Dü beş', 6: 'Düşeş'};

          /// Atışın tavladaki adı ve rakamları: "Şeşbeş 6-5", "Dubara 2-2", "Cihar se 4-3".
          String rollName(int a, int b) {
            final hi = max(a, b), lo = min(a, b);
            final String name;
            if (hi == lo) {
              name = _doubles[hi]!;
            } else if (hi == 6 && lo == 5) {
              name = 'Şeşbeş';
            } else {
              final w = '${_fa[hi]} ${_fa[lo]}';
              name = w[0].toUpperCase() + w.substring(1);
            }
            return '$name $hi-$lo';
          }

          /// Bir zar atışı. [by] atan oyuncu (0 ya da 1), [amount] el değiştiren akçe.
          class Roll {
            const Roll(this.d1, this.d2, this.by, this.out, this.amount);
            final int d1, d2, by, amount;
            final Outcome out;
          }

          const _winning = {'6-6', '5-5', '3-3', '6-5'};
          const _losing = {'1-1', '2-2', '4-4', '2-1'};

          Outcome judge(int a, int b) {
            final key = '${max(a, b)}-${min(a, b)}';
            if (_winning.contains(key)) return Outcome.win;
            if (_losing.contains(key)) return Outcome.lose;
            return Outcome.pass;
          }

          class Game {
            static const start = 100;
            static const stake = 10;

            final List<int> akce = [start, start];
            final List<Roll> log = [];
            int turn = 0;
            int? winner;
            final Random _rng = Random.secure();

            bool get over => winner != null;

            /// Zarı atar ama sonucu henüz uygulamaz: animasyon bitince [apply] çağrılır.
            Roll draw() {
              final d1 = _rng.nextInt(6) + 1, d2 = _rng.nextInt(6) + 1;
              final s = turn, o = 1 - turn, out = judge(d1, d2);
              final amount = switch (out) {
                Outcome.win => min(stake, akce[o]),
                Outcome.lose => min(stake, akce[s]),
                Outcome.pass => 0,
              };
              return Roll(d1, d2, s, out, amount);
            }

            bool endsGame(Roll r) {
              if (r.out == Outcome.pass) return false;
              final loser = r.out == Outcome.win ? 1 - r.by : r.by;
              return akce[loser] - r.amount <= 0;
            }

            void apply(Roll r) {
              final o = 1 - r.by;
              if (r.out == Outcome.win) {
                akce[o] -= r.amount;
                akce[r.by] += r.amount;
              } else if (r.out == Outcome.lose) {
                akce[r.by] -= r.amount;
                akce[o] += r.amount;
              }
              log.insert(0, r);
              if (log.length > 12) log.removeLast();
              turn = o; // zar her atıştan sonra rakibe geçer
              if (akce[0] <= 0) winner = 1;
              if (akce[1] <= 0) winner = 0;
            }

            void reset() {
              final w = winner;
              akce[0] = start;
              akce[1] = start;
              turn = w == null ? 0 : 1 - w; // kaybeden başlar
              winner = null;
              log.clear();
            }
          }
          BARBUT_EOF
          cat > lib/sound.dart <<'BARBUT_EOF'
          import 'dart:async';

          import 'package:flutter_soloud/flutter_soloud.dart';

          import 'errors.dart';

          /// Oyun sesi motoru (SoLoud): kısa sesleri gecikmesiz, üst üste ve
          /// sağ/sol yönlü çalar. Bütün sesler açılışta belleğe yüklenir.
          class SoundEngine {
            SoundEngine._();
            static final SoundEngine I = SoundEngine._();

            static const names = [
              'clack_1', 'clack_2', 'cup_1', 'cup_2', 'cup_hit_1', 'cup_hit_2', 'cup_hit_3', 'cup_hit_4',
              'final', 'lose', 'palm_1', 'palm_2', 'palm_3', 'palm_4', 'pass', 'rail_1', 'rail_2',
              'release', 'table_hit_1', 'table_hit_2', 'table_hit_3', 'table_hit_4', 'table_tick_1',
              'table_tick_2', 'table_tick_3', 'throw_1', 'throw_2', 'throw_3', 'tick_1', 'tick_2',
              'tick_3', 'tick_4', 'win',
            ];

            final Map<String, AudioSource> _sources = {};
            bool get ready => _sources.isNotEmpty;

            Future<void> init() async {
              try {
                await SoLoud.instance.init();
              } catch (e, s) {
                ErrorLog.add(e, s);
                return;
              }
              for (final n in names) {
                try {
                  _sources[n] = await SoLoud.instance.loadAsset('assets/sounds/$n.wav');
                } catch (e, s) {
                  ErrorLog.add(e, s);
                }
              }
            }

            /// [pan]: -1 sol, 0 orta, 1 sağ.
            void play(String name, {double volume = 1, double pan = 0}) {
              final src = _sources[name];
              if (src == null) return;
              Future.sync(() => SoLoud.instance.play(
                    src,
                    volume: volume.clamp(0.0, 1.0),
                    pan: pan.clamp(-1.0, 1.0),
                  )).then((_) {}, onError: (Object e, StackTrace s) => ErrorLog.add(e, s));
            }
          }
          BARBUT_EOF
          cat > lib/feel.dart <<'BARBUT_EOF'
          import 'dart:async';
          import 'dart:io' show Platform;
          import 'dart:math';

          import 'package:flutter/services.dart';
          import 'package:vibration/vibration.dart';

          import 'errors.dart';
          import 'game.dart';
          import 'sound.dart';

          typedef _IosHaptic = Future<void> Function();

          /// Ses + titreşim. Tüm zamanlamalar ekrandaki zar animasyonuyla aynı.
          ///
          /// Düğmeyle atış:   0 ms def + kupada çalkalama, 640 ms savruluş,
          ///                  860/1100/1300/1440/1540 ms tepsiye çarpmalar, 1720 ms sonuç.
          /// Sallayarak atış: kupa kısmı atlanır (onu zaten elinde hissettin),
          ///                  savruluş 0 ms'de, sonuç 1080 ms'de.
          class Feel {
            Feel._();
            static final Feel I = Feel._();

            static const cupMs = 640;
            static int revealAt(bool fromShake) => (fromShake ? 0 : cupMs) + 1080;

            bool soundOn = true;
            bool hapticsOn = true;

            final _rng = Random();
            final List<Timer> _timers = [];

            bool _canVibrate = false;
            bool _amplitude = false;

            Future<void> init() async {
              try {
                _canVibrate = (await Vibration.hasVibrator()) == true;
                _amplitude = (await Vibration.hasAmplitudeControl()) == true;
              } catch (e, s) {
                ErrorLog.add(e, s);
              }
            }

            Future<void> _guard(Future<void> Function() fn) async {
              try {
                await fn();
              } catch (e, s) {
                ErrorLog.add(e, s);
              }
            }

            void cancel() {
              for (final t in _timers) {
                t.cancel();
              }
              _timers.clear();
            }

            void _at(int ms, void Function() fn) =>
                _timers.add(Timer(Duration(milliseconds: ms), fn));

            void _play(String name, {double volume = 1}) {
              if (!soundOn) return;
              SoundEngine.I.play(name, volume: volume);
            }

            /// Tek bir titreşim darbesi. Android'de süre + güç (1-255),
            /// iPhone'da Taptic Engine darbesi.
            void _hit(int ms, int amplitude, _IosHaptic ios) {
              if (!hapticsOn) return;
              if (Platform.isIOS || !_canVibrate) {
                _guard(ios);
                return;
              }
              if (_amplitude) {
                _guard(() => Vibration.vibrate(duration: ms, amplitude: amplitude.clamp(1, 255)));
              } else {
                _guard(() => Vibration.vibrate(duration: ms));
              }
            }

            /// Telefon sallanırken zarın kupada çarpması.
            void tick(double power) {
              _play('tick_${1 + _rng.nextInt(4)}', volume: (0.45 + power / 40).clamp(0.4, 1.0));
              _hit(14, (70 + power * 5).round().clamp(60, 200), HapticFeedback.selectionClick);
            }

            void playThrow(Roll r, {required bool fromShake, required bool finalRoll}) {
              cancel();
              final t0 = fromShake ? 0 : cupMs;

              if (!fromShake) {
                _play('cup_${1 + _rng.nextInt(2)}');
                _at(0, () => _hit(55, 255, HapticFeedback.heavyImpact));
                for (final t in const [90, 160, 215, 300, 355, 430, 490, 570, 625]) {
                  _at(t, () => _hit(16, 110, HapticFeedback.selectionClick));
                }
              }

              _at(t0, () => _play('throw_${1 + _rng.nextInt(3)}'));

              // tepsiye çarpmalar: [zaman, süre, güç]
              const bounces = [
                [220, 55, 255],
                [460, 34, 190],
                [660, 22, 140],
                [800, 13, 100],
                [900, 8, 70],
              ];
              for (var i = 0; i < bounces.length; i++) {
                final b = bounces[i];
                final _IosHaptic ios = i == 0
                    ? HapticFeedback.heavyImpact
                    : i < 3
                        ? HapticFeedback.mediumImpact
                        : HapticFeedback.lightImpact;
                _at(t0 + b[0], () => _hit(b[1], b[2], ios));
              }

              _scheduleResult(t0 + 1080, r.out, finalRoll);
            }

            /// Sonuç sesi + titreşimi hemen çalar (avuç modunda zarlar durunca).
            void playResult(Outcome out, {bool finalRoll = false}) {
              cancel();
              _scheduleResult(0, out, finalRoll);
            }

            void _scheduleResult(int tr, Outcome out, bool finalRoll) {
              _at(tr, () {
                _play(switch (out) {
                  Outcome.win => 'win',
                  Outcome.lose => 'lose',
                  Outcome.pass => 'pass',
                });
              });
              switch (out) {
                case Outcome.win: // üç kısa, sonuncusu dolgun
                  _at(tr, () => _hit(28, 200, HapticFeedback.mediumImpact));
                  _at(tr + 80, () => _hit(28, 200, HapticFeedback.mediumImpact));
                  _at(tr + 170, () => _hit(90, 255, HapticFeedback.heavyImpact));
                case Outcome.lose: // uzun, ağır bir gong titreşimi
                  _at(tr, () => _hit(240, 255, HapticFeedback.heavyImpact));
                  _at(tr + 110, () { if (Platform.isIOS) _guard(HapticFeedback.heavyImpact); });
                  _at(tr + 230, () { if (Platform.isIOS) _guard(HapticFeedback.mediumImpact); });
                case Outcome.pass:
                  _at(tr, () => _hit(18, 90, HapticFeedback.lightImpact));
              }
              if (finalRoll) {
                _at(tr + 2400, () => _play('final'));
                for (final d in const [0, 90, 180, 270, 900]) {
                  _at(tr + 2400 + d, () => _hit(d == 900 ? 200 : 25, 255, HapticFeedback.heavyImpact));
                }
              }
            }
          }
          BARBUT_EOF
          cat > lib/hand_feel.dart <<'BARBUT_EOF'
          import 'dart:io' show Platform;
          import 'dart:math';

          import 'package:flutter/services.dart';
          import 'package:vibration/vibration.dart';

          import 'errors.dart';
          import 'feel.dart';
          import 'physics.dart';
          import 'sound.dart';

          /// Her tek çarpmanın sesi ve titreşimi; sertliği çarpmanın hızıyla orantılı.
          class ImpactFeel {
            ImpactFeel._();
            static final ImpactFeel I = ImpactFeel._();

            final _rng = Random();
            bool _canVibrate = false, _amplitude = false;
            DateTime _lastHaptic = DateTime(0), _lastSound = DateTime(0);
            double _lastStrength = 0;

            Future<void> init() async {
              try {
                _canVibrate = (await Vibration.hasVibrator()) == true;
                _amplitude = (await Vibration.hasAmplitudeControl()) == true;
              } catch (e, s) {
                ErrorLog.add(e, s);
              }
            }

            Future<void> _guard(Future<void> Function() fn) async {
              try {
                await fn();
              } catch (e, s) {
                ErrorLog.add(e, s);
              }
            }

            String _pick(String base, int count) => '${base}_${1 + _rng.nextInt(count)}';

            void _sound(String name, double volume, double pan) {
              if (!Feel.I.soundOn) return;
              final now = DateTime.now();
              if (now.difference(_lastSound).inMilliseconds < 8 && volume < 0.6) return;
              _lastSound = now;
              SoundEngine.I.play(name, volume: volume, pan: pan * 0.7);
            }

            void _haptic(double strength, {int baseMs = 10}) {
              if (!Feel.I.hapticsOn || strength <= 0) return;
              final now = DateTime.now();
              if (now.difference(_lastHaptic).inMilliseconds < 28 && strength < _lastStrength * 1.4) return;
              _lastHaptic = now;
              _lastStrength = strength;
              if (Platform.isIOS || !_canVibrate) {
                final Future<void> Function() f = strength > 0.66
                    ? HapticFeedback.heavyImpact
                    : strength > 0.33
                        ? HapticFeedback.mediumImpact
                        : strength > 0.12
                            ? HapticFeedback.lightImpact
                            : HapticFeedback.selectionClick;
                _guard(f);
                return;
              }
              final ms = (baseMs + 30 * strength).round();
              final amp = (35 + 220 * strength).round().clamp(1, 255);
              if (_amplitude) {
                _guard(() => Vibration.vibrate(duration: ms, amplitude: amp));
              } else {
                _guard(() => Vibration.vibrate(duration: ms));
              }
            }

            /// Zarlar elde / fincanda.
            void cup(HitKind kind, double s, double pan, {required bool palm}) {
              if (kind == HitKind.dice) {
                _sound(_pick('clack', 2), 0.2 + 0.7 * s, pan);
                _haptic(s * 0.8, baseMs: 6);
                return;
              }
              if (palm) {
                _sound(_pick('palm', 4), 0.25 + 0.75 * s, pan);
                _haptic(s * 0.85, baseMs: 14);
              } else {
                _sound(_pick('cup_hit', 4), 0.2 + 0.8 * s, pan);
                _haptic(s, baseMs: 8);
              }
            }

            /// Zarlar masada.
            void table(HitKind kind, double s, double pan) {
              switch (kind) {
                case HitKind.table:
                  _sound(_pick('table_hit', 4), 0.25 + 0.75 * s, pan);
                  _haptic(s, baseMs: 12);
                case HitKind.tick:
                  _sound(_pick('table_tick', 3), 0.15 + 0.6 * s, pan);
                  _haptic(s * 0.6, baseMs: 6);
                case HitKind.rail:
                  _sound(_pick('rail', 2), 0.25 + 0.75 * s, pan);
                  _haptic(s, baseMs: 14);
                case HitKind.dice:
                  _sound(_pick('clack', 2), 0.25 + 0.75 * s, pan);
                  _haptic(s * 0.8, baseMs: 6);
                case HitKind.settle:
                  _haptic(0.15, baseMs: 6);
                case HitKind.wall:
                case HitKind.floor:
                  break;
              }
            }

            void release(double strength) {
              _sound('release', 0.45 + 0.4 * strength.clamp(0.0, 1.0), 0);
              _haptic(0.45, baseMs: 8);
            }
          }
          BARBUT_EOF
          cat > lib/physics.dart <<'BARBUT_EOF'
          import 'dart:math';
          import 'dart:ui' show Size;

          enum HitKind { wall, floor, dice, table, tick, rail, settle }

          /// [strength] 0..1 arası: çarpmanın ne kadar sert olduğu. [pan]: -1 sol, 1 sağ.
          typedef HitFn = void Function(HitKind kind, double strength, double pan);

          /* =====================================================================
           *  ELDEKİ ZARLAR
           *  Telefon bir kupa/avuç gibi düşünülür. Zarlar içeride serbestçe
           *  hareket eder; ivmeölçerin ölçtüğü her hareket zarlara ters yönde
           *  bir kuvvet olarak yansır (gerçek bir kupadaki gibi).
           *  Birimler metre ve saniye; ivme m/s².
           * ===================================================================== */
          class CupSim {
            CupSim({required this.onHit});

            final HitFn onHit;
            bool palm = false; // true: avuç içi (yumuşak), false: kahve fincanı (sert)

            static const radius = 0.032; // kabın yarıçapı
            static const height = 0.04; // kabın yüksekliği
            static const die = 0.0085; // zarın yarı boyu

            final List<_CupDie> dice = [_CupDie(-0.01, 0), _CupDie(0.01, 0)];
            double ax = 0, ay = 0, az = 9.81;

            /// Son sıfırlamadan beri kaç sert çarpma oldu (sallandı mı?).
            int hardHits = 0;

            void setAccel(double x, double y, double z) {
              ax = x;
              ay = y;
              az = z;
            }

            void reset() {
              hardHits = 0;
              dice[0].place(-0.01, 0);
              dice[1].place(0.01, 0);
            }

            /// Zarların ortalama yatay hızı: fırlatma yönüne katkı verir.
            double get biasX => (dice[0].vx + dice[1].vx) / 2;

            void step(double dt) {
              const n = 4;
              for (var i = 0; i < n; i++) {
                _sub(dt / n);
              }
            }

            void _sub(double dt) {
              // Zarların telefona göre ivmesi = ölçülen ivmenin tersi.
              final gx = -ax, gy = -ay, gz = -az;
              final e = palm ? 0.22 : 0.55; // sekme katsayısı
              final mu = palm ? 0.65 : 0.3; // sürtünme
              const lim = radius - die;

              for (final p in dice) {
                p.vx += gx * dt;
                p.vy += gy * dt;
                p.vz += gz * dt;

                final onFloor = p.z <= die + 1e-4 && gz < 0;
                final onCeil = p.z >= height - die - 1e-4 && gz > 0;
                if (onFloor || onCeil) {
                  final sp = sqrt(p.vx * p.vx + p.vy * p.vy);
                  final dec = mu * gz.abs() * dt;
                  if (sp <= dec) {
                    p.vx = 0;
                    p.vy = 0;
                  } else {
                    p.vx -= p.vx / sp * dec;
                    p.vy -= p.vy / sp * dec;
                  }
                }

                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.z += p.vz * dt;

                final d = sqrt(p.x * p.x + p.y * p.y);
                if (d > lim) {
                  final nx = p.x / d, ny = p.y / d;
                  final vn = p.vx * nx + p.vy * ny;
                  p.x = nx * lim;
                  p.y = ny * lim;
                  if (vn > 0) {
                    p.vx -= (1 + e) * vn * nx;
                    p.vy -= (1 + e) * vn * ny;
                    _hit(HitKind.wall, vn, p.x / radius);
                  }
                }
                if (p.z < die) {
                  p.z = die;
                  if (p.vz < 0) {
                    final vn = -p.vz;
                    p.vz = vn < 0.05 ? 0.0 : vn * e;
                    _hit(HitKind.floor, vn, p.x / radius);
                  }
                }
                if (p.z > height - die) {
                  p.z = height - die;
                  if (p.vz > 0) {
                    final vn = p.vz;
                    p.vz = vn < 0.05 ? 0.0 : -vn * e;
                    _hit(HitKind.floor, vn, p.x / radius);
                  }
                }
              }

              // zar-zar çarpışması
              final a = dice[0], b = dice[1];
              final dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
              final dist = sqrt(dx * dx + dy * dy + dz * dz);
              const minD = die * 2;
              if (dist < minD && dist > 1e-6) {
                final nx = dx / dist, ny = dy / dist, nz = dz / dist;
                final push = (minD - dist) / 2;
                a.x -= nx * push;
                a.y -= ny * push;
                a.z -= nz * push;
                b.x += nx * push;
                b.y += ny * push;
                b.z += nz * push;
                final rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny + (b.vz - a.vz) * nz;
                if (rel < 0) {
                  final j = -(1 + e) * rel / 2;
                  a.vx -= j * nx;
                  a.vy -= j * ny;
                  a.vz -= j * nz;
                  b.vx += j * nx;
                  b.vy += j * ny;
                  b.vz += j * nz;
                  _hit(HitKind.dice, -rel, (a.x + b.x) / 2 / radius);
                }
              }
            }

            void _hit(HitKind kind, double vn, double pan) {
              if (vn < 0.07) return;
              if (vn > 0.7) hardHits++; // gerçekten sallandı
              onHit(kind, (vn / 1.6).clamp(0.0, 1.0), pan.clamp(-1.0, 1.0));
            }
          }

          class _CupDie {
            _CupDie(this.x, this.y);
            double x, y, z = CupSim.die, vx = 0, vy = 0, vz = 0;

            void place(double nx, double ny) {
              x = nx;
              y = ny;
              z = CupSim.die;
              vx = 0;
              vy = 0;
              vz = 0;
            }
          }

          /* =====================================================================
           *  MASADAKİ ZARLAR
           *  Ekran, yukarıdan bakılan ahşap masadır. Birimler piksel.
           *  Zar küp gibi yuvarlanır: her kenar üstüne devrilmede üstteki yüz
           *  değişir. Sonuç atış anında belirlenir (adil ve rastgele); fizik
           *  zarın o yüz üstünde durmasını sağlar.
           * ===================================================================== */
          class TableDie {
            double x = 0, y = 0, z = 0, vx = 0, vy = 0, vz = 0;
            double phi = 0; // geçerli devrilmenin açısı, 0..π/2
            double spin = 0; // havadayken takla hızı (rad/s)
            double heading = 0, visHeading = 0;
            int top = 1, next = 2, target = 1;
            bool settled = true, entered = false;
          }

          class TableSim {
            TableSim(this.size, {required this.onHit});

            Size size;
            final HitFn onHit;
            final List<TableDie> dice = [TableDie(), TableDie()];
            final _rng = Random();
            double _t = 0;
            bool active = false;

            static const rail = 18.0;
            double topInset = 0; // üstteki skor şeridinin altında kalsınlar

            double get s => min(size.width, size.height) * 0.16; // zar boyu
            double get _g => s * 60; // yerçekimi (px/s²)
            double get _friction => s * 17; // yuvarlanma sürtünmesi (px/s²)

            double _pan(double x) => (x / size.width * 2 - 1).clamp(-1.0, 1.0);

            bool get allSettled => active && dice.every((d) => d.settled);

            List<int> _adjacent(int top) => [1, 2, 3, 4, 5, 6].where((f) => f != top && f != 7 - top).toList();

            int _chooseNext(TableDie d, bool slow) {
              final adj = _adjacent(d.top);
              if (slow && adj.contains(d.target)) return d.target;
              return adj[_rng.nextInt(adj.length)];
            }

            /// [strength] 0.5..1.4, [startX] 0..1 ekran genişliğine göre,
            /// [dirX] -0.6..0.6 sağa/sola sapma.
            void launch(List<int> targets, double strength, double startX, double dirX) {
              _t = 0;
              active = true;
              final w = size.width, h = size.height;
              for (var i = 0; i < dice.length; i++) {
                final d = dice[i];
                d.target = targets[i];
                d.top = 1 + _rng.nextInt(6);
                d.next = _chooseNext(d, false);
                d.phi = _rng.nextDouble() * 0.6;
                d.settled = false;
                d.entered = false;
                d.x = w * startX.clamp(0.25, 0.75) + (i == 0 ? -1 : 1) * s * 0.75;
                d.y = h + s * 0.6;
                // zarlar masanın ortasında dursun diye ayarlı (500 atışlık simülasyonla)
                final speed = h * (0.65 + 0.3 * ((strength - 0.5) / 0.9).clamp(0.0, 1.0)) * (0.9 + 0.2 * _rng.nextDouble());
                final ang = dirX * 0.8 + (_rng.nextDouble() - 0.5) * 0.4;
                d.vx = speed * sin(ang);
                d.vy = -speed * cos(ang);
                d.z = s * 0.9;
                d.vz = s * (7 + 4 * strength) * (0.85 + 0.3 * _rng.nextDouble());
                d.spin = 14 + 12 * _rng.nextDouble();
                d.heading = atan2(d.vy, d.vx);
                d.visHeading = d.heading;
              }
            }

            void step(double dt) {
              if (!active) return;
              _t += dt;
              const n = 3;
              for (var i = 0; i < n; i++) {
                _sub(dt / n);
              }
              if (_t > 8 && !allSettled) {
                for (final d in dice) {
                  d
                    ..top = d.target
                    ..phi = 0
                    ..z = 0
                    ..vx = 0
                    ..vy = 0
                    ..vz = 0
                    ..settled = true;
                }
              }
            }

            void _sub(double dt) {
              final w = size.width, h = size.height;
              final half = s * 0.55;
              final minX = rail + half, maxX = w - rail - half;
              final minY = rail + half + topInset, maxY = h - rail - half;

              for (final d in dice) {
                if (d.settled) continue;
                final airborne = d.z > 0 || d.vz > 0;
                var sp = sqrt(d.vx * d.vx + d.vy * d.vy);

                if (airborne) {
                  d.vz -= _g * dt;
                  d.z += d.vz * dt;
                  d.x += d.vx * dt;
                  d.y += d.vy * dt;
                  d.phi += d.spin * dt;
                  if (d.z <= 0) {
                    d.z = 0;
                    final impact = -d.vz;
                    d.vz = impact > s * 2.5 ? impact * 0.36 : 0.0;
                    d.vx *= 0.8;
                    d.vy *= 0.8;
                    sp *= 0.8;
                    d.spin = sp / s * (pi / 2) + 6;
                    onHit(HitKind.table, (impact / (s * 13)).clamp(0.0, 1.0), _pan(d.x));
                  }
                } else if (sp > 0) {
                  final ns = max(0.0, sp - _friction * dt);
                  d.vx *= ns / sp;
                  d.vy *= ns / sp;
                  d.x += d.vx * dt;
                  d.y += d.vy * dt;
                  d.phi += ns * dt / s * (pi / 2);
                  sp = ns;
                }
                if (sp > 4) d.heading = atan2(d.vy, d.vx);

                // kenar üstüne devrilme → yeni yüz
                while (d.phi >= pi / 2) {
                  d.phi -= pi / 2;
                  d.top = d.next;
                  final slow = sp < s * 3.5;
                  d.next = _chooseNext(d, slow);
                  if (!airborne && d.z == 0) {
                    onHit(HitKind.tick, (sp / (s * 22)).clamp(0.06, 0.6), _pan(d.x));
                    if (sp > s * 5) d.vz = sp * 0.05; // hızlı yuvarlanırken küçük sıçrama
                  }
                }

                // kenarlar
                if (d.y < maxY) d.entered = true;
                if (d.x < minX) {
                  d.x = minX;
                  if (d.vx < 0) {
                    onHit(HitKind.rail, (-d.vx / (s * 25)).clamp(0.0, 1.0), _pan(d.x));
                    d.vx = -d.vx * 0.5;
                  }
                }
                if (d.x > maxX) {
                  d.x = maxX;
                  if (d.vx > 0) {
                    onHit(HitKind.rail, (d.vx / (s * 25)).clamp(0.0, 1.0), _pan(d.x));
                    d.vx = -d.vx * 0.5;
                  }
                }
                if (d.y < minY) {
                  d.y = minY;
                  if (d.vy < 0) {
                    onHit(HitKind.rail, (-d.vy / (s * 25)).clamp(0.0, 1.0), _pan(d.x));
                    d.vy = -d.vy * 0.5;
                  }
                }
                if (d.entered && d.y > maxY) {
                  d.y = maxY;
                  if (d.vy > 0) {
                    onHit(HitKind.rail, (d.vy / (s * 25)).clamp(0.0, 1.0), _pan(d.x));
                    d.vy = -d.vy * 0.5;
                  }
                }

                // yavaşladı: hedef yüz üstünde dur
                final grounded = d.z == 0 && d.vz == 0;
                if (grounded && sqrt(d.vx * d.vx + d.vy * d.vy) < s * 0.5) {
                  d.vx = 0;
                  d.vy = 0;
                  if (d.phi > pi / 4 || d.top != d.target) {
                    if (d.phi < 0.03 && d.top != d.target) d.next = _chooseNext(d, true);
                    d.phi += 7 * dt; // son devrilme
                  } else {
                    d.phi -= d.phi * min(1.0, 14 * dt);
                    if (d.phi < 0.004) {
                      d.phi = 0;
                      d.settled = true;
                      onHit(HitKind.settle, 0.15, _pan(d.x));
                    }
                  }
                }

                // görünen yön yumuşakça hareket yönüne döner
                final diff = atan2(sin(d.heading - d.visHeading), cos(d.heading - d.visHeading));
                d.visHeading += diff * min(1.0, dt * 10);
              }

              // zar-zar
              final a = dice[0], b = dice[1];
              if (!(a.settled && b.settled) && (a.z - b.z).abs() < s * 0.6) {
                final dx = b.x - a.x, dy = b.y - a.y;
                final dist = sqrt(dx * dx + dy * dy);
                final minD = s * 1.05;
                if (dist < minD && dist > 0.01) {
                  final nx = dx / dist, ny = dy / dist;
                  final push = (minD - dist) / 2;
                  a.x -= nx * push;
                  a.y -= ny * push;
                  b.x += nx * push;
                  b.y += ny * push;
                  final rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
                  if (rel < 0) {
                    final j = -(1 + 0.4) * rel / 2;
                    a.vx -= j * nx;
                    a.vy -= j * ny;
                    b.vx += j * nx;
                    b.vy += j * ny;
                    if (a.settled && j.abs() > 1) a.settled = false;
                    if (b.settled && j.abs() > 1) b.settled = false;
                    onHit(HitKind.dice, (-rel / (s * 20)).clamp(0.0, 1.0), _pan((a.x + b.x) / 2));
                  }
                }
              }
            }
          }
