            bool shakeOn = false;
            bool verdictOn = false;
            Roll? shown;
            Timer? _reveal;

            late final ShakeDetector _shake = ShakeDetector(
              onRattle: (p) => Feel.I.tick(p),
              onRelease: () => _roll(fromShake: true),
            );

            @override
            void dispose() {
              _reveal?.cancel();
              _shake.stop();
              Feel.I.cancel();
              super.dispose();
            }

            void _syncShake() => _shake.enabled = shakeOn && !busy && !game.over;

            void _roll({required bool fromShake}) {
              if (busy || game.over) return;
              final r = game.draw();
              final ends = game.endsGame(r);
              setState(() {
                busy = true;
                rollId++;
                dice = [r.d1, r.d2];
                withCup = !fromShake;
                verdictOn = false;
              });
              _syncShake();
              Feel.I.playThrow(r, fromShake: fromShake, finalRoll: ends);
              _reveal?.cancel();
              _reveal = Timer(Duration(milliseconds: Feel.revealAt(fromShake)), () {
                if (!mounted) return;
                setState(() {
                  game.apply(r);
                  shown = r;
                  busy = false;
                  verdictOn = true;
                });
                _syncShake();
              });
            }

            void _rematch() {
              setState(() {
                game.reset();
                shown = null;
                verdictOn = false;
              });
              _syncShake();
            }

            void _toggleShake() {
              setState(() => shakeOn = !shakeOn);
              if (shakeOn) {
                _shake.start();
              } else {
                _shake.stop();
              }
              _syncShake();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: ListView(
                    padding: const EdgeInsets.fromLTRB(16, 8, 16, 32),
                    children: [
                      _topBar(),
                      _errors(),
                      const SizedBox(height: 12),
                      Row(children: [
                        Expanded(child: _plaque(0)),
                        const SizedBox(width: 10),
                        Expanded(child: _plaque(1)),
                      ]),
                      const SizedBox(height: 16),
                      _tray(context),
                      const SizedBox(height: 20),
                      _controls(),
                      const SizedBox(height: 28),
                      _title('Son atışlar'),
                      ..._log(),
                      const SizedBox(height: 28),
                      _title('Atışlar'),
                      const RulesLegend(),
                    ],
                  ),
                ),
              );
            }

