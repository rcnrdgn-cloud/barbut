      - name: Uygulama ikonu
        working-directory: barbut_app
        run: |
          pip install pillow
          python tool/make_icon.py

      - name: Titreşim izni ve uygulama adı
        working-directory: barbut_app
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.VIBRATE' "$M"; then
            sed -i '0,/<application/s##<uses-permission android:name="android.permission.VIBRATE"/>\n    <application#' "$M"
          fi
          sed -i 's#android:label="barbut"#android:label="Barbut"#' "$M"
          cat "$M"
          grep -q 'android.permission.VIBRATE' "$M" || { echo "VIBRATE izni eklenemedi"; exit 1; }

      - name: Paketleri indir
        working-directory: barbut_app
        run: flutter pub get

      - name: Kod kontrolü (yalnızca bilgi)
        working-directory: barbut_app
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Kural testleri
        working-directory: barbut_app
        run: flutter test

      - name: APK derle
        working-directory: barbut_app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: barbut-android
          path: barbut_app/build/app/outputs/flutter-apk/app-release.apk
