              final last = _lastGyro;
              _lastGyro = now;
              _gyroOk = true;
              if (last == null) return;
              final dt = (now.difference(last).inMicroseconds / 1e6).clamp(0.0, 0.05);
              // sabit bir vektör telefona göre g × ω hızıyla döner
              final nx = _gx + (_gy * e.z - _gz * e.y) * dt;
              final ny = _gy + (_gz * e.x - _gx * e.z) * dt;
              final nz = _gz + (_gx * e.y - _gy * e.x) * dt;
              final n = sqrt(nx * nx + ny * ny + nz * nz);
              if (n > 0.1) {
                _gx = nx / n * 9.81;
                _gy = ny / n * 9.81;
                _gz = nz / n * 9.81;
              }
              _tiltRate = -e.x;
              _checkPour();
