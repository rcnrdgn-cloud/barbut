            void _checkPour() {
              if (phase != Phase.holding || game.over) return;
              final tilt = _tilt;
              if (tilt <= rearmAngle) _armed = true;
              final shaking = DateTime.now().difference(_lastJolt).inMilliseconds < shakeQuietMs;
