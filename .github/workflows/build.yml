          cat > tool/make_sounds.py <<'BARBUT_EOF'
          """Barbut ses dosyalarını sıfırdan üretir (dosya indirmez, kayıt kullanmaz).

          Çalıştırma:  python tool/make_sounds.py
          Çıktı:       assets/sounds/*.wav  (44.1 kHz, mono, 16 bit)
          """
          import os
          import wave
          import numpy as np
          from scipy.signal import butter, sosfilt, fftconvolve

          SR = 44100
          rng = np.random.default_rng(1453)
          OUT = os.path.join(os.path.dirname(__file__), "..", "assets", "sounds")
          os.makedirs(OUT, exist_ok=True)

          HICAZ = [293.66, 311.13, 369.99, 392.0, 440.0, 466.16, 523.25, 587.33]


          def buf(sec):
              return np.zeros(int(SR * sec))


          def env(n, att, rel_curve=6.0):
              """Hızlı yükselen, üstel sönen zarf."""
              a = max(1, int(SR * att))
              e = np.ones(n)
              e[:a] = np.linspace(0, 1, a)
              t = np.linspace(0, 1, n - a)
              e[a:] = np.exp(-rel_curve * t)
              return e


          def band(x, lo, hi, order=2):
              lo = max(20, lo)
              hi = min(SR / 2 - 100, hi)
              sos = butter(order, [lo, hi], btype="band", fs=SR, output="sos")
              return sosfilt(sos, x)


          def lowpass(x, f, order=2):
              return sosfilt(butter(order, f, btype="low", fs=SR, output="sos"), x)


          def highpass(x, f, order=2):
              return sosfilt(butter(order, f, btype="high", fs=SR, output="sos"), x)


          def add(dst, src, at, gain=1.0):
              i = int(at * SR)
              if i >= len(dst):
                  return
              n = min(len(src), len(dst) - i)
              dst[i:i + n] += src[:n] * gain


          def noise_burst(dur, f, q=2.0, att=0.002, curve=6.0):
              n = int(SR * dur)
              x = rng.uniform(-1, 1, n)
              bw = f / q
              return band(x, f - bw / 2, f + bw / 2) * env(n, att, curve) * 3


          def sine(dur, f0, f1=None, att=0.005, curve=6.0, vib=0.0, vib_depth=0.0):
              n = int(SR * dur)
              t = np.arange(n) / SR
              f = np.full(n, f0) if f1 is None else f0 * (f1 / f0) ** (t / dur)
              if vib:
                  f = f + np.sin(2 * np.pi * vib * t) * vib_depth
              ph = 2 * np.pi * np.cumsum(f) / SR
              return np.sin(ph) * env(n, att, curve)


          def impulse_response(sec=3.0, decay=2.6):
              n = int(SR * sec)
              t = np.linspace(0, 1, n)
              ir = rng.uniform(-1, 1, n) * (1 - t) ** decay
              ir[: int(SR * 0.012)] *= np.linspace(0, 1, int(SR * 0.012))
              ir = lowpass(ir, 5200)
              return ir / np.sqrt(np.sum(ir ** 2))


          IR = impulse_response()


          def verb(dry, wet=0.45):
              w = fftconvolve(dry, IR)[: len(dry)]
              return dry + w * wet


          def bone_click(gain=1.0, pitch=1.0):
              """Kemik zarın sert yüzeye çarpması: tiz tık + kısa rezonans + gövde."""
              x = buf(0.12)
              add(x, noise_burst(0.045, 3100 * pitch + rng.uniform(-300, 300), q=2.2, curve=9), 0, 0.42)
              add(x, sine(0.07, 1650 * pitch + rng.uniform(-150, 150), curve=8), 0, 0.12)
              add(x, sine(0.06, 170, 90, curve=7), 0, 0.22)
              return x * gain


          def bell(dur, f, gain):
              x = buf(dur)
              for m, a in [(1, 1), (2.76, 0.45), (5.4, 0.22), (8.93, 0.1)]:
                  add(x, sine(dur, f * m, att=0.003, curve=4.5 * (m * 0.6 + 0.4)), 0, gain * a)
              return x


          def gong(dur, f, gain):
              x = buf(dur)
              for m, a in [(1, 1), (1.47, 0.6), (2.09, 0.4), (2.56, 0.3), (3.3, 0.15)]:
                  add(x, sine(dur, f * m, f * m * 0.985, att=0.02, curve=3.2), 0, gain * a)
              add(x, lowpass(rng.uniform(-1, 1, int(SR * 0.25)), 600) * env(int(SR * 0.25), 0.002, 8), 0, 0.5 * gain)
              return x


          def ney(dur, f, gain):
              x = buf(dur + 0.1)
              add(x, lowpass(sine(dur, f, att=0.22, curve=3, vib=5.2, vib_depth=f * 0.012), 1800), 0, gain)
              add(x, lowpass(sine(dur, f * 2, att=0.3, curve=3), 2400), 0, gain * 0.18)
              n = int(SR * dur)
              add(x, band(rng.uniform(-1, 1, n), f * 1.6, f * 2.6) * env(n, 0.2, 3) * 2, 0, gain * 0.25)
              return x


          def master(x, peak=0.89):
              x = np.tanh(x * 1.2)  # yumuşak sıkıştırma
              fade = int(SR * 0.03)
              x[-fade:] *= np.linspace(1, 0, fade)
              return x / (np.max(np.abs(x)) + 1e-9) * peak


          def save(name, x, peak=0.89):
              x = master(x, peak)
              with wave.open(os.path.join(OUT, name), "wb") as w:
                  w.setnchannels(1)
                  w.setsampwidth(2)
                  w.setframerate(SR)
                  w.writeframes((x * 32767).astype(np.int16).tobytes())
              print(name, f"{len(x) / SR:.2f}s")


          # --- sonuç sesleri ---
          x = buf(4.2)
          for k, n in enumerate([0, 2, 3, 4, 7]):
              add(x, bell(2.2, HICAZ[n] * 2, 0.09), k * 0.075)
          add(x, bell(3.6, HICAZ[7] * 2, 0.12), 0.45)
          add(x, gong(3.0, 98, 0.18), 0)
          sh = highpass(rng.uniform(-1, 1, int(SR * 1.6)), 7000) * env(int(SR * 1.6), 0.3, 3)
          add(x, sh, 0.4, 0.05)
          save("win.wav", verb(x, 0.7))

          x = buf(5.0)
          add(x, gong(4.5, 61.7, 0.42), 0)
          for k, n in enumerate([7, 6, 4, 2, 1, 0]):
              add(x, ney(1.8 if k == 5 else 0.32, HICAZ[n] / 2, 0.11), 0.3 + k * 0.24)
          save("lose.wav", verb(x, 0.8))

          x = buf(2.6)
          add(x, ney(1.1, HICAZ[4], 0.12), 0)
          add(x, ney(1.3, HICAZ[3], 0.09), 0.55)
          save("pass.wav", verb(x, 0.75), peak=0.75)

          x = buf(6.0)
          for k in range(8):
              add(x, bell(1.8, HICAZ[k] * 2, 0.08), k * 0.09)
          add(x, gong(5.0, 73.4, 0.35), 0.8)
          add(x, bell(4.5, HICAZ[0] * 4, 0.1), 0.85)
          save("final.wav", verb(x, 0.75))



          # Zar çarpma sesleri burada üretilmez: gerçek zar kayıtlarından (Kenney Casino Audio,
          # CC0 / kamu malı) kesilmiş tek tek çarpmalar derleme sırasında assets/sounds içine açılır.


          # =====================================================================
          #  EĞLENCELİ SONUÇ SESLERİ (win_fun, lose_fun)
          #  Klasik win/lose yukarıda aynen duruyor; ayarlardan seçilebilir.
          #  Bakır nefesli tınısı toplamalı sentezle: her harmoniğin gücü zamanla
          #  değişir, böylece borazanın parlaması ve trombon sürdinasının "va-va"sı
          #  filtre gerekmeden elde edilir.
          # =====================================================================

          def horn(dur, freq, bright, amp, nh=28, breath=0.0):
              """freq, bright (etkin harmonik sayısı), amp: her örnek için dizi ya da sabit."""
              n = int(SR * dur)
              t = np.arange(n) / SR
              f = np.broadcast_to(np.asarray(freq, dtype=float), (n,)) if np.ndim(freq) == 0 else freq[:n]
              b = np.broadcast_to(np.asarray(bright, dtype=float), (n,)) if np.ndim(bright) == 0 else bright[:n]
              a = np.broadcast_to(np.asarray(amp, dtype=float), (n,)) if np.ndim(amp) == 0 else amp[:n]
              ph = 2 * np.pi * np.cumsum(f) / SR
              x = np.zeros(n)
              for k in range(1, nh + 1):
                  w = np.exp(-(k - 1) / np.maximum(b, 0.3)) / k
                  w = np.where(k * f < SR / 2 - 500, w, 0)
                  x += w * np.sin(k * ph)
              if breath:
                  x += band(rng.uniform(-1, 1, n), 900, 3000) * breath * (b / 8)
              return x * a


          def adsr(n, a, d, s, r):
              e = np.full(n, s)
              ai, di, ri = int(SR * a), int(SR * d), int(SR * r)
              e[:ai] = np.linspace(0, 1, ai)
              e[ai:ai + di] = np.linspace(1, s, di)
              e[n - ri:] *= np.linspace(1, 0, ri)
              return e


          def coin(gain=1.0):
              """Akçe şıngırtısı: ince metal paranın uyumsuz kısmi tınıları, kısa ve parlak."""
              x = buf(0.35)
              f0 = rng.uniform(2300, 3500)
              for m, a, tau in [(1, 1, 0.12), (1.47, 0.6, 0.09), (2.09, 0.45, 0.07), (2.56, 0.3, 0.05), (3.7, 0.2, 0.03)]:
                  n = len(x)
                  tt = np.arange(n) / SR
                  x += a * np.sin(2 * np.pi * f0 * m * rng.uniform(0.99, 1.01) * tt) * np.exp(-tt / (tau * rng.uniform(0.7, 1.3)))
              n = int(SR * 0.004)
              x[:n] += highpass(rng.uniform(-1, 1, n), 4000) * 0.8
              return x * gain * 0.25


          def room_s(dry, wet=0.15):
              ir = impulse_response(0.5, 4.0)
              return dry + fftconvolve(dry, ir)[: len(dry)] * wet


          # --- kazanma: neşeli borazan arpeji + yağmur gibi dökülen akçeler ---
          x = buf(2.6)
          C5, E5, G5, C6, E6 = 523.25, 659.26, 783.99, 1046.5, 1318.5
          for i, f in enumerate([C5, E5, G5]):
              n = int(SR * 0.11)
              add(x, horn(0.11, f, 2 + 6 * np.linspace(1, 0.6, n), adsr(n, 0.008, 0.05, 0.7, 0.03)), i * 0.09, 0.32)
          # son nota: parlayan, titreşimli uzun do + üstünde mi
          n = int(SR * 1.0)
          t = np.arange(n) / SR
          vib = 1 + 0.008 * np.sin(2 * np.pi * 5.6 * t) * np.clip(t / 0.3, 0, 1)
          swell = 3 + 6 * np.clip(t / 0.12, 0, 1) - 2 * np.clip((t - 0.5) / 0.5, 0, 1)
          add(x, horn(1.0, C6 * vib, swell, adsr(n, 0.01, 0.15, 0.8, 0.35), breath=0.02), 0.27, 0.34)
          add(x, horn(1.0, G5 * vib, swell * 0.8, adsr(n, 0.02, 0.15, 0.7, 0.35)), 0.29, 0.2)
          add(x, horn(1.0, E6 * vib, swell * 0.6, adsr(n, 0.03, 0.2, 0.5, 0.4)), 0.31, 0.12)
          # akçeler: önce sık, sonra seyrek; kimi tek, kimi sekerek iki kez
          times = np.sort(0.32 + rng.beta(1.4, 3.0, 22) * 1.9)
          for at in times:
              g = rng.uniform(0.5, 1.0)
              add(x, coin(g), at)
              if rng.random() < 0.45:
                  add(x, coin(g * 0.45), at + rng.uniform(0.05, 0.11))
          # en sonda tek bir parlak "çın"
          add(x, bell(1.2, C6 * 2, 0.06), 1.15)
          x = room_s(x, 0.18)
          save("win_fun.wav", x / np.max(np.abs(x)) * 0.8)  # önce ölçekle: sıkıştırma bozmasın

          # --- kaybetme: sürdinalı trombon "va-va-va-vaaa" ---
          x = buf(3.0)
          notes = [(233.08, 0.0, 0.40), (220.0, 0.44, 0.40), (207.65, 0.88, 0.40), (196.0, 1.32, 1.45)]
          for k, (f, at, dur) in enumerate(notes):
              n = int(SR * dur)
              t = np.arange(n) / SR
              if k < 3:
                  wah = 1.5 + 6.5 * np.sin(np.pi * np.clip(t / dur, 0, 1)) ** 1.5  # sürdina açılıp kapanır
                  freq = f * (1 - 0.012 * np.exp(-t / 0.04))  # nota başında hafif aşağıdan gelme
                  amp = adsr(n, 0.03, 0.08, 0.85, 0.08)
              else:
                  # son nota: titreyen "vaaaa", sonunda yarım ton aşağı kayar
                  wah = 2 + 5 * (0.5 + 0.5 * np.sin(2 * np.pi * 3.6 * t)) * np.clip(t / 0.15, 0, 1)
                  slide = 1 - 0.06 * np.clip((t - 0.95) / 0.5, 0, 1) ** 2
                  freq = f * slide * (1 + 0.02 * np.sin(2 * np.pi * 5.8 * t) * np.clip((t - 0.2) / 0.4, 0, 1))
                  amp = adsr(n, 0.03, 0.1, 0.9, 0.45)
              add(x, horn(dur, freq, wah, amp, nh=22, breath=0.03), at, 0.5)
          x = room_s(x, 0.15)
          save("lose_fun.wav", x / np.max(np.abs(x)) * 0.8, peak=0.72)
          BARBUT_EOF
          ls -R lib test

