              ("('${r.sum} · geçemedi −${r.amount}',", "('${rollName(r.d1, r.d2)} · geçemedi −${r.amount}',"),
              ("('${r.sum} · berabere',", "('${rollName(r.d1, r.d2)} · berabere',"),
