              ImpactFeel.I.cup(kind, s, pan, palm: cup.palm);
              if (diceOnTable && s > 0.2) {
                // zarları masadan aldı: sıradaki atış başlıyor
                setState(() {
                  diceOnTable = false;
                  verdictOn = false;
                });
              }
            }

            void _onGyro(GyroscopeEvent e) {
              if (phase != Phase.holding || game.over) return;
              if (DateTime.now().difference(_phaseStart).inMilliseconds < 700) return;
              // fincanı devirir gibi bilek silkelemesi: telefonun yatay ekseni etrafında hızlı dönüş
              final flick = e.x.abs();
              if (flick > 7 && cup.hardHits >= 1) {
                final bias = cup.biasX;
                _throw(
                  strength: (flick / 12).clamp(0.6, 1.4),
                  startX: 0.5 + (bias * 0.15).clamp(-0.25, 0.25),
                  dirX: (bias * 0.3).clamp(-0.5, 0.5),
                );
              }
            }

            /* ---------------- atış ---------------- */

            double get _shakeStrength => (0.7 + cup.hardHits * 0.04).clamp(0.7, 1.3);

            /// Telefonun ucu masaya doğru çevrildi: zarlar fincandan döküldü.
            /// Masaya düşüşleri, ekran tekrar sana dönünce (ya da en geç 1,2 sn sonra) başlar.
            void _release() {
              if (phase != Phase.holding || game.over || table == null) return;
              _releaseStrength = _shakeStrength;
              _releasedAt = DateTime.now();
              ImpactFeel.I.release(_releaseStrength);
              setState(() {
                phase = Phase.released;
                diceOnTable = false;
                verdictOn = false;
              });
            }

            void _throw({required double strength, required double startX, required double dirX}) {
              final t = table;
              if ((phase != Phase.holding && phase != Phase.released) || game.over || t == null) return;
              final r = game.draw();
              pending = r;
              t.launch([r.d1, r.d2], strength, startX, dirX);
              if (phase == Phase.holding) ImpactFeel.I.release(strength);
              setState(() {
                phase = Phase.flying;
                verdictOn = false;
                diceOnTable = false;
                throws++;
              });
            }

            void _onTick(Duration elapsed) {
              final dt = ((elapsed - _last).inMicroseconds / 1e6).clamp(0.0, 0.05);
              _last = elapsed;
              if (phase == Phase.holding) {
                cup.step(dt);
                // dökme hareketi: telefonun üst ucu aşağı bakıyor ya da ekran yere dönük
                final pointingDown = _gy < -3.5 || _gz < -4.0;
                _downMs = pointingDown ? _downMs + dt * 1000 : 0;
                if (_downMs > 60 && DateTime.now().difference(_phaseStart).inMilliseconds > 500) {
                  _downMs = 0;
                  _release();
                }
              } else if (phase == Phase.released) {
                final lookingAgain = _gy > 1.5 && _gz > -1;
                if (lookingAgain || DateTime.now().difference(_releasedAt).inMilliseconds > 1200) {
                  _throw(
                    strength: _releaseStrength,
                    startX: 0.5 + (_gx * -0.03).clamp(-0.2, 0.2),
                    dirX: (_gx * -0.05).clamp(-0.4, 0.4),
                  );
                }
              } else if (phase == Phase.flying) {
                final t = table;
                if (t == null) return;
                t.step(dt);
                _frame.value++;
                if (t.allSettled) _onSettled();
              }
            }

            void _onSettled() {
              phase = Phase.result;
              final r = pending;
              if (r == null) return;
              final ends = game.endsGame(r);
              _timer?.cancel();
              _timer = Timer(const Duration(milliseconds: 250), () {
                if (!mounted) return;
                setState(() {
                  game.apply(r);
                  shown = r;
                  verdictOn = true;
                });
                Feel.I.playResult(r.out, finalRoll: ends);
                _timer = Timer(const Duration(milliseconds: 1500), () {
                  if (!mounted || game.over) return;
                  cup.reset();
                  _phaseStart = DateTime.now();
                  setState(() {
                    phase = Phase.holding;
                    diceOnTable = true;
                  });
                });
              });
            }

            void _newGame() {
              _timer?.cancel();
              Feel.I.cancel();
              cup.reset();
              _phaseStart = DateTime.now();
              setState(() {
                game.reset();
                shown = null;
                pending = null;
                verdictOn = false;
                diceOnTable = false;
                phase = Phase.holding;
              });
            }

            /* ---------------- ekran ---------------- */

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                body: LayoutBuilder(builder: (context, c) {
                  final size = Size(c.maxWidth, c.maxHeight);
